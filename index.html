<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pembuat Rencana Belajar</title>
    <style>
      :root {
        --ink: #14213d;
        --paper: #f3f6fb;
        --line: #c9d3e6;
        --mark: #ffd23f;
        --card: #ffffff;
        --err: #b3261e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8edf8;
          --paper: #0f1626;
          --line: #2c3a5a;
          --card: #18223a;
          --err: #ff8a80;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.55 Georgia, "Times New Roman", serif;
        background-image: linear-gradient(var(--line) 1px, transparent 1px);
        background-size: 100% 28px;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 4px;
      }

      h1 span {
        background: linear-gradient(transparent 60%, var(--mark) 60%);
      }

      p.sub {
        margin: 0 0 24px;
        max-width: 60ch;
      }

      form {
        background: var(--card);
        border: 2px solid var(--ink);
        padding: 20px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }

      .full {
        grid-column: 1 / -1;
      }

      label {
        display: grid;
        gap: 4px;
        font-weight: bold;
        font-size: 0.95rem;
      }

      input,
      select,
      button {
        font: inherit;
        padding: 10px;
        border: 2px solid var(--ink);
        background: var(--card);
        color: var(--ink);
        border-radius: 0;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--mark);
        outline-offset: 2px;
      }

      button {
        cursor: pointer;
        font-weight: bold;
      }

      button.primary {
        background: var(--mark);
        color: #14213d;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #status {
        min-height: 1.5em;
        margin: 16px 0 0;
      }

      #status.error {
        color: var(--err);
      }

      .wrap {
        overflow-x: auto;
        margin-top: 8px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        min-width: 640px;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--ink);
        color: var(--paper);
      }

      tr.review td {
        background: color-mix(in srgb, var(--mark) 25%, var(--card));
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      @media (max-width: 600px) {
        form {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        body {
          background: #ffffff;
          color: #000000;
        }

        form,
        .actions,
        #status,
        p.sub {
          display: none;
        }

        th {
          background: #dddddd;
          color: #000000;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>Pembuat</span> Rencana Belajar</h1>
      <p class="sub">
        Isi topik, waktu luang, dan target. Aplikasi akan menyusun jadwal harian
        yang bisa langsung kamu pakai.
      </p>

      <form id="form">
        <label class="full">
          Topik yang ingin dipelajari
          <input id="topic" required maxlength="100" placeholder="Contoh: dasar-dasar Excel" />
        </label>

        <label>
          Waktu belajar per hari
          <select id="minutes">
            <option value="30">30 menit</option>
            <option value="60" selected>1 jam</option>
            <option value="120">2 jam</option>
          </select>
        </label>

        <label>
          Level saat ini
          <select id="level">
            <option>pemula</option>
            <option>menengah</option>
            <option>mahir</option>
          </select>
        </label>

        <label>
          Target waktu
          <select id="target">
            <option value="7">1 minggu</option>
            <option value="14">2 minggu</option>
            <option value="30" selected>1 bulan</option>
            <option value="date">Tanggal tertentu</option>
          </select>
        </label>

        <label id="dateWrap" hidden>
          Tanggal target
          <input type="date" id="date" />
        </label>

        <button class="primary full" id="go" type="submit">Buat Rencana</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <div id="result" hidden>
        <div class="wrap">
          <table>
            <thead>
              <tr>
                <th>Hari</th>
                <th>Materi</th>
                <th>Aktivitas</th>
                <th>Estimasi</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div class="actions">
          <button id="copy" type="button">Salin</button>
          <button id="print" type="button">Cetak</button>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let plan = [];

      $("target").addEventListener("change", () => {
        const custom = $("target").value === "date";
        $("dateWrap").hidden = !custom;
        $("date").required = custom;
        $("date").min = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
      });

      function countDays() {
        if ($("target").value !== "date") {
          return Number($("target").value);
        }

        const diff = Math.ceil((new Date($("date").value) - new Date()) / 86400000);
        return Math.min(Math.max(diff, 1), 30);
      }

      function setStatus(message, isError = false) {
        $("status").textContent = message;
        $("status").className = isError ? "error" : "";
      }

      function render(items) {
        $("rows").innerHTML = "";

        items.forEach((item) => {
          const row = document.createElement("tr");

          if (/review|latihan|istirahat/i.test(item.materi)) {
            row.className = "review";
          }

          [item.hari, item.materi, item.aktivitas, item.estimasi].forEach((value) => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          $("rows").appendChild(row);
        });

        $("result").hidden = false;
      }

      $("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("go").disabled = true;
        $("result").hidden = true;
        setStatus("Menyusun rencana, tunggu sebentar...");

        try {
          const response = await fetch("/api/generate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              topic: $("topic").value.trim(),
              level: $("level").value,
              minutes: Number($("minutes").value),
              days: countDays(),
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Terjadi kesalahan.");
          }

          plan = data.plan;
          render(plan);
          setStatus(`Rencana ${plan.length} hari siap.`);
        } catch (error) {
          setStatus("Gagal membuat rencana: " + error.message + " Coba lagi.", true);
        } finally {
          $("go").disabled = false;
        }
      });

      $("copy").addEventListener("click", async () => {
        const text = plan
          .map((row) => [row.hari, row.materi, row.aktivitas, row.estimasi].join("\t"))
          .join("\n");

        try {
          await navigator.clipboard.writeText(text);
          setStatus("Jadwal disalin.");
        } catch (error) {
          setStatus("Tidak bisa menyalin. Pilih tabel lalu salin manual.", true);
        }
      });

      $("print").addEventListener("click", () => window.print());
    </script>
  </body>
</html>
